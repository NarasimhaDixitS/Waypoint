name: Waypoint
options:
  bundleIdPrefix: com.narasimhadixit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  # Pinned to a major version rather than a branch: a purchase path that silently changes
  # behaviour on someone else's release schedule is not something to find out about from a
  # customer who paid and got nothing.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
targets:
  Waypoint:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LogoMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Must match Generated/Waypoint.entitlements. Read at runtime rather than hardcoded in
        # Swift, because those two drifted apart once already and nothing said so.
        WPAppGroupIdentifier: group.com.narasimhadixit.waypoint
        CFBundleURLTypes:
          - CFBundleURLName: com.narasimhadixit.waypoint
            CFBundleURLSchemes:
              - waypoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narasimhadixit.waypoint
        # Matches the App ID Xcode already registered, and the app group's own naming. The
        # project said `com.waypoint.app` while the only provisioning profiles on disk were for
        # `com.narasimhadixit.waypoint` — a mismatch the simulator never checks, and a plausible
        # reason the widget has never once worked on real hardware.
        DEVELOPMENT_TEAM: 23495RS836
        CODE_SIGN_ENTITLEMENTS: Generated/Waypoint.entitlements
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETSCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_EMIT_LOC_STRINGS: true
    dependencies:
      - target: WaypointWidgetExtension
        embed: true
      - package: RevenueCat
        product: RevenueCat
    scheme:
      testTargets:
        - WaypointTests
  WaypointWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WaypointWidget
      # Shared with the app rather than duplicated: the widget needs the same model, the same
      # task rules and the same colour tokens, and a second copy of any of them would drift.
      - path: Sources/Models
      - path: Sources/Persistence
      - path: Sources/Theme/AccentSwatch.swift
      - path: Sources/Theme/ColorTokens.swift
      # The tokens read `Palette.current`, so the widget needs it too — and gets the paper
      # palette for free as a result. A bright widget beside a paper app is the thing that
      # makes both look unfinished, so following along isn't optional.
      - path: Sources/Theme/Palette.swift
      - path: Resources
    info:
      path: Generated/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Waypoint
        WPAppGroupIdentifier: group.com.narasimhadixit.waypoint
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narasimhadixit.waypoint.widget
        DEVELOPMENT_TEAM: 23495RS836
        CODE_SIGN_ENTITLEMENTS: Generated/WaypointWidget.entitlements
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"

  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # The widget's own types, so its snapshot logic is covered by the app's suite rather
      # than being the one part of the codebase nothing checks.
      - path: WaypointWidget/DaySnapshot.swift
    dependencies:
      - target: Waypoint
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: true
