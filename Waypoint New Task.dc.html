<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="{{ S.page }}">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" width="{{ deviceWidth }}" height="{{ deviceHeight }}" hint-size="402,874">
    <div style="{{ S.screen }}">
      <div style="{{ S.titleRow }}">
        <h1 style="{{ S.title }}">New task</h1>
        <div style="{{ S.controls }}">
          <button style="{{ S.moonBtn }}" onClick="{{ toggleTheme }}" aria-label="Toggle theme">
            <svg width="18" height="18" viewBox="0 0 20 20" style="{{ S.sunIconDisplay }}">
              <circle cx="10" cy="10" r="4.2" fill="{{ S.iconColor }}"></circle>
              <path d="M10 1.5v2.4M10 16.1v2.4M18.5 10h-2.4M3.9 10H1.5M15.9 4.1l-1.7 1.7M5.8 14.2l-1.7 1.7M15.9 15.9l-1.7-1.7M5.8 5.8L4.1 4.1" stroke="{{ S.iconColor }}" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
            <svg width="18" height="18" viewBox="0 0 20 20" style="{{ S.moonIconDisplay }}">
              <path d="M16.5 12.7A7 7 0 018 4.2a7 7 0 108.5 8.5z" fill="{{ S.iconColor }}"></path>
            </svg>
          </button>
          <div style="{{ S.dotsRow }}">
            <div style="{{ S.dotGreen }}" onClick="{{ setAccentGreen }}"><div style="{{ S.dotGreenInner }}"></div></div>
            <div style="{{ S.dotBlue }}" onClick="{{ setAccentBlue }}"><div style="{{ S.dotBlueInner }}"></div></div>
            <div style="{{ S.dotOrange }}" onClick="{{ setAccentOrange }}"><div style="{{ S.dotOrangeInner }}"></div></div>
          </div>
        </div>
      </div>

      <div style="{{ S.nameField }}">
        <span style="{{ S.fieldPlaceholder }}">Task name</span>
      </div>

      <div style="{{ S.rowFields }}">
        <div style="{{ S.smallField }}"><span style="{{ S.fieldValue }}">9:00 AM</span></div>
        <div style="{{ S.smallField }}"><span style="{{ S.fieldValue }}">60 min</span></div>
      </div>

      <p style="{{ S.sectionLabel }}">Priority</p>
      <div style="{{ S.priorityRow }}">
        <div style="{{ S.priorityHigh }}" onClick="{{ selectHigh }}">High</div>
        <div style="{{ S.priorityMedium }}" onClick="{{ selectMedium }}">Medium</div>
        <div style="{{ S.priorityLow }}" onClick="{{ selectLow }}">Low</div>
      </div>

      <div style="{{ S.notesRow }}">
        <svg width="16" height="16" viewBox="0 0 16 16" style="{{ S.notesIcon }}">
          <rect x="2" y="1" width="12" height="14" rx="1.6" stroke="{{ S.notesColor }}" stroke-width="1.4" fill="none"></rect>
          <path d="M4.5 5h7M4.5 8h7M4.5 11h4.5" stroke="{{ S.notesColor }}" stroke-width="1.3" stroke-linecap="round"></path>
        </svg>
        <span style="{{ S.notesLabel }}">Add notes</span>
        <span style="{{ S.proBadge }}">Pro</span>
      </div>
    </div>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:950},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B6D11&quot;,&quot;options&quot;:[&quot;#3B6D11&quot;,&quot;#378ADD&quot;,&quot;#EEFF00&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;}}">
class Component extends DCLogic {
  state = { theme: this.props.theme || 'light', accent: this.props.accentColor || '#3B6D11', priority: 'high' };

  hexToRgb(hex) { const h = hex.replace('#', ''); return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) }; }
  rgbToHex(r, g, b) { const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); return `#${c(r)}${c(g)}${c(b)}`; }
  mix(hex1, hex2, pct1) { const c1 = this.hexToRgb(hex1), c2 = this.hexToRgb(hex2); return this.rgbToHex(c1.r * pct1 + c2.r * (1 - pct1), c1.g * pct1 + c2.g * (1 - pct1), c1.b * pct1 + c2.b * (1 - pct1)); }
  contrastOn(hex) { const { r, g, b } = this.hexToRgb(hex); const luma = (0.299 * r + 0.587 * g + 0.114 * b) / 255; return luma > 0.6 ? '#000000' : '#FFFFFF'; }

  getTokens() {
    const light = this.state.theme === 'light';
    const accent = this.state.accent;
    const isDefaultBlue = accent.toUpperCase() === '#378ADD';
    const fillAccent = isDefaultBlue ? (light ? '#378ADD' : '#85B7EB') : (light ? accent : this.mix(accent, '#FFFFFF', 0.6));
    const surface1 = light ? '#FFFFFF' : '#242422';
    const bgAccentTint = this.mix(fillAccent, surface1, light ? 0.16 : 0.4);
    return {
      light, surface1,
      surface0: light ? '#F5F5F3' : '#1C1C1A',
      textPrimary: light ? '#2C2C2A' : '#F1EFE8',
      textSecondary: light ? '#5F5E5A' : '#B4B2A9',
      textMuted: '#888780',
      border: light ? '#E5E3DB' : '#3A3A37',
      fillAccent, bgAccentTint,
      shadow: light ? '0 1px 3px rgba(0,0,0,0.07)' : '0 1px 3px rgba(0,0,0,0.4)',
    };
  }

  renderVals() {
    const t = this.getTokens();
    const FS = '-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif';
    const priorityColor = '#D85A30';
    const pillBase = { flex: 1, textAlign: 'center', borderRadius: 18, padding: '13px 8px', fontSize: 14.5, fontWeight: 500, cursor: 'pointer', boxSizing: 'border-box' };
    const contrastText = t.light ? '#000000' : '#FFFFFF';
    const S = {
      page: { display: 'flex', justifyContent: 'center', padding: '40px 0', background: '#e9e7e1', minHeight: '100%', fontFamily: FS },
      screen: { height: '100%', overflow: 'auto', background: t.surface0, fontFamily: FS, boxSizing: 'border-box', padding: '52px 20px 20px' },
      titleRow: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' },
      title: { fontSize: 28, fontWeight: 700, color: t.textPrimary, letterSpacing: '-0.5px', margin: 0 },
      controls: { display: 'flex', alignItems: 'center', gap: 10, paddingTop: 6, flexShrink: 0 },
      moonBtn: { width: 22, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: t.textSecondary, background: 'none', border: 'none', padding: 0 },
      iconColor: t.textSecondary,
      moonIconDisplay: { display: t.light ? 'block' : 'none' },
      sunIconDisplay: { display: t.light ? 'none' : 'block' },
      dotsRow: { display: 'flex', alignItems: 'center', gap: 7 },
      dotGreen: { width: this.state.accent === '#3B6D11' ? 18 : 16, height: this.state.accent === '#3B6D11' ? 18 : 16, borderRadius: '50%', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', transition: 'width .15s, height .15s', boxShadow: this.state.accent === '#3B6D11' ? `0 0 0 2px ${t.surface0}, 0 0 0 3.5px #3B6D11` : 'none' },
      dotBlue: { width: this.state.accent === '#378ADD' ? 18 : 16, height: this.state.accent === '#378ADD' ? 18 : 16, borderRadius: '50%', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', transition: 'width .15s, height .15s', boxShadow: this.state.accent === '#378ADD' ? `0 0 0 2px ${t.surface0}, 0 0 0 3.5px #378ADD` : 'none' },
      dotOrange: { width: this.state.accent === '#EEFF00' ? 18 : 16, height: this.state.accent === '#EEFF00' ? 18 : 16, borderRadius: '50%', background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', transition: 'width .15s, height .15s', boxShadow: this.state.accent === '#EEFF00' ? `0 0 0 2px ${t.surface0}, 0 0 0 3.5px #EEFF00` : 'none' },
      dotGreenInner: { width: 12, height: 12, borderRadius: '50%', background: '#3B6D11' },
      dotBlueInner: { width: 12, height: 12, borderRadius: '50%', background: '#378ADD' },
      dotOrangeInner: { width: 12, height: 12, borderRadius: '50%', background: '#EEFF00' },
      nameField: { background: t.surface1, border: `1px solid ${t.border}`, borderRadius: 18, padding: '15px 18px', marginTop: 20 },
      fieldPlaceholder: { fontSize: 15, color: t.textMuted, fontWeight: 400 },
      rowFields: { display: 'flex', gap: 9, marginTop: 9 },
      smallField: { flex: 1, background: t.surface1, border: `1px solid ${t.border}`, borderRadius: 18, padding: '15px 8px', textAlign: 'center' },
      fieldValue: { fontSize: 15, color: t.textPrimary, fontWeight: 500 },
      sectionLabel: { fontSize: 13, fontWeight: 400, color: t.textSecondary, margin: '24px 0 10px' },
      priorityRow: { display: 'flex', gap: 9 },
      priorityHigh: { ...pillBase, background: t.surface1, border: `1.5px solid ${this.state.priority === 'high' ? priorityColor : t.border}`, color: this.state.priority === 'high' ? priorityColor : t.textPrimary },
      priorityMedium: { ...pillBase, background: t.surface1, border: `1.5px solid ${this.state.priority === 'medium' ? priorityColor : t.border}`, color: this.state.priority === 'medium' ? priorityColor : t.textPrimary },
      priorityLow: { ...pillBase, background: t.surface1, border: `1.5px solid ${this.state.priority === 'low' ? priorityColor : t.border}`, color: this.state.priority === 'low' ? priorityColor : t.textPrimary },
      notesRow: { background: t.bgAccentTint, borderRadius: 18, padding: '15px 16px', display: 'flex', alignItems: 'center', gap: 10, marginTop: 24, cursor: 'pointer' },
      notesIcon: { flexShrink: 0 },
      notesColor: contrastText,
      notesLabel: { fontSize: 16, fontWeight: 700, color: contrastText, flex: 1 },
      proBadge: { fontSize: 11, fontWeight: 700, color: this.contrastOn(t.fillAccent), background: t.fillAccent, borderRadius: 20, padding: '3px 10px' },
    };
    return {
      S, isDark: !t.light, deviceWidth: 402, deviceHeight: 874,
      toggleTheme: () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' })),
      setAccentGreen: () => this.setState({ accent: '#3B6D11' }),
      setAccentBlue: () => this.setState({ accent: '#378ADD' }),
      setAccentOrange: () => this.setState({ accent: '#EEFF00' }),
      selectHigh: () => this.setState({ priority: 'high' }),
      selectMedium: () => this.setState({ priority: 'medium' }),
      selectLow: () => this.setState({ priority: 'low' }),
    };
  }
}

</script>
</body>
</html>
